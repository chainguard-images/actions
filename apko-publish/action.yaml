name: 'Build image with apko'
description: |
  This action build an OCI image with apko, given a config file
  and tag to use.

inputs:
  apko-image:
    description: |
      The digest of the apko image to invoke.
    default: ghcr.io/wolfi-dev/sdk:latest
    required: true

  config:
    description: |
      The config file to use for building the image.
    default: .apko.yaml

  lockfile:
    description: |
      The lock file that constraints versions of packages.
    required: false
    default: ''

  tag:
    description: |
      The tag to use for publishing the image.
    required: true

  repository_owner:
    description: |
      The repository owner's GitHub username.
    default: ${{ github.repository_owner }}

  repository:
    description: |
      The repository name.
    default: ${{ github.repository }}

  token:
    description: |
      The repository owner's GitHub token.
    default: ${{ github.token }}

  image_refs:
    description: |
      The value to pass to --image-refs.
    default: /tmp/apko.images

  keyring-append:
    description: |
      The value to pass to --keyring-append.
    default: ''

  build-repository-append:
    description: |
      The value to pass to --build-repository-append.
    required: false
    default: ''

  repository-append:
    description: |
      The value to pass to --repository-append.
    default: ''

  package-append:
    description: |
      The value to pass to --package-append.
    default: ''

  archs:
    description: |
      The architectures to build for.
    default: ''

  build-options:
    description: |
      Build options to enable (comma-separated).
    default: ''

  source-date-epoch:
    description: |
      The UNIX timestamp to use as the source date when building an image.
      This is set as the SOURCE_DATE_EPOCH environment variable.
    default: ''

  vcs-url:
    description: |
      Whether to detect and embed the VCS URL (unlike apko we default this to false for reproducible builds).
    type: boolean
    required: false
    default: false

  debug:
    description: |
      Enable debug logging.
    type: boolean
    required: false
    default: false

  automount-src:
    description: |
      If this directory is found, create a copy at automount-dest (inside container)
    default: ${{ github.workspace }}/.apko-automount

  automount-dest:
    description: |
      If automount-src is found, create a copy at this location (inside container)
    default: /work

  sbom-path:
    description: |
      Path to write the SBOMs.
    required: false
    default: ''

  generic-user:
    description: |
      Username to login to registry.
    required: false
    default: ''

  generic-pass:
    description: |
      Password to login to registry.
    required: false
    default: ''

  annotations:
    description: |
      Annotations to add to the image. Format: key1:value1,key2:value2.
    required: false
    default: ''

outputs:
  digest:
    value: ${{ steps.docker-run.outputs.digest }}
    description: |
      The digest of the published container image.

runs:
  using: composite
  steps:
  - id: docker-run
    shell: bash
    run: |
      APKO_IMAGE="${INPUTS_APKO_IMAGE}"
      if [[ "${APKO_IMAGE}" == "" ]]; then
        echo "Warning: using latest wolfi-dev/sdk image since apko-image input was empty string."
        APKO_IMAGE="ghcr.io/wolfi-dev/sdk:latest"
      fi
      docker run -i --rm --entrypoint /bin/sh \
        --network host \
        -v $PWD:${{ github.workspace }} \
        -v /tmp:/tmp \
        --workdir ${{ github.workspace }} \
        -e "GITHUB_ACTOR=${INPUTS_REPOSITORY_OWNER}" \
        -e "GITHUB_TOKEN=${INPUTS_TOKEN}" \
        -e "REPOSITORY=${INPUTS_REPOSITORY}" \
        -e INPUTS_GENERIC_USER \
        -e INPUTS_GENERIC_PASS \
        -e INPUTS_TAG \
        -e INPUTS_AUTOMOUNT_SRC \
        -e INPUTS_AUTOMOUNT_DEST \
        -e INPUTS_SOURCE_DATE_EPOCH \
        -e INPUTS_KEYRING_APPEND \
        -e INPUTS_BUILD_REPOSITORY_APPEND \
        -e INPUTS_REPOSITORY_APPEND \
        -e INPUTS_PACKAGE_APPEND \
        -e INPUTS_ARCHS \
        -e INPUTS_ANNOTATIONS \
        -e INPUTS_BUILD_OPTIONS \
        -e INPUTS_SBOM_PATH \
        -e INPUTS_VCS_URL \
        -e INPUTS_LOCKFILE \
        -e INPUTS_IMAGE_REFS \
        -e INPUTS_CONFIG \
        "${APKO_IMAGE}" \
        -c "$(cat <<"EOF"
      set -o errexit
      set -o pipefail

      if [[ "${INPUTS_GENERIC_USER}" != "" && "${INPUTS_GENERIC_PASS}" != "" ]]; then
        echo "${INPUTS_GENERIC_PASS}" | \
          /usr/bin/apko login -u "${INPUTS_GENERIC_USER}" \
            --password-stdin "$(echo "${INPUTS_TAG}" | cut -d'/' -f1)"
      fi

      if [ -d "${INPUTS_AUTOMOUNT_SRC}" ]; then
        echo "Creating copy of ${INPUTS_AUTOMOUNT_SRC} at ${INPUTS_AUTOMOUNT_DEST}"
        cp -r "${INPUTS_AUTOMOUNT_SRC}" "${INPUTS_AUTOMOUNT_DEST}"
      fi
      [ -n "${INPUTS_SOURCE_DATE_EPOCH}" ] && export SOURCE_DATE_EPOCH="${INPUTS_SOURCE_DATE_EPOCH}"
      [ -n "${INPUTS_KEYRING_APPEND}" ] && keys="-k ${INPUTS_KEYRING_APPEND}"
      [ -n "${INPUTS_BUILD_REPOSITORY_APPEND}" ] && build_repos="-b ${INPUTS_BUILD_REPOSITORY_APPEND}"
      [ -n "${INPUTS_REPOSITORY_APPEND}" ] && repos="-r ${INPUTS_REPOSITORY_APPEND}"
      [ -n "${INPUTS_PACKAGE_APPEND}" ] && packages="-p ${INPUTS_PACKAGE_APPEND}"
      [ -n  "${INPUTS_ARCHS}" ] && archs="--arch ${INPUTS_ARCHS}"
      [ -n  "${INPUTS_ANNOTATIONS}" ] && annotations="--annotations ${INPUTS_ANNOTATIONS}"
      build_options=""
      if [ -n "${INPUTS_BUILD_OPTIONS}" ]; then
        opts="${INPUTS_BUILD_OPTIONS}"
        for opt in ${opts//,/ }; do
          build_options="${build_options} --build-option ${opt}"
        done
      fi

      sbomPath="--sbom-path=${INPUTS_SBOM_PATH}"

      export DIGEST_FILE="/tmp/digest"
      /usr/bin/apko publish \
        --vcs=${INPUTS_VCS_URL} \
        --lockfile=${INPUTS_LOCKFILE} \
        ${{ inputs.debug && '--log-level debug' }} \
        --image-refs="${INPUTS_IMAGE_REFS}" ${INPUTS_CONFIG} ${INPUTS_TAG} $keys $build_repos $repos $packages $archs $annotations $build_options $sbomPath | tee ${DIGEST_FILE}
      echo EXIT CODE: $?
      EOF
      )"

      echo "digest=$(cat /tmp/digest)" >> $GITHUB_OUTPUT
    env:
      INPUTS_APKO_IMAGE: ${{ inputs.apko-image }}
      INPUTS_REPOSITORY_OWNER: ${{ inputs.repository_owner }}
      INPUTS_TOKEN: ${{ inputs.token }}
      INPUTS_REPOSITORY: ${{ inputs.repository }}
      INPUTS_GENERIC_USER: ${{ inputs.generic-user }}
      INPUTS_GENERIC_PASS: ${{ inputs.generic-pass }}
      INPUTS_TAG: ${{ inputs.tag }}
      INPUTS_AUTOMOUNT_SRC: ${{ inputs.automount-src }}
      INPUTS_AUTOMOUNT_DEST: ${{ inputs.automount-dest }}
      INPUTS_SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
      INPUTS_KEYRING_APPEND: ${{ inputs.keyring-append }}
      INPUTS_BUILD_REPOSITORY_APPEND: ${{ inputs.build-repository-append }}
      INPUTS_REPOSITORY_APPEND: ${{ inputs.repository-append }}
      INPUTS_PACKAGE_APPEND: ${{ inputs.package-append }}
      INPUTS_ARCHS: ${{ inputs.archs }}
      INPUTS_ANNOTATIONS: ${{ inputs.annotations }}
      INPUTS_BUILD_OPTIONS: ${{ inputs.build-options }}
      INPUTS_SBOM_PATH: ${{ inputs.sbom-path }}
      INPUTS_VCS_URL: ${{ inputs.vcs-url }}
      INPUTS_LOCKFILE: ${{ inputs.lockfile }}
      INPUTS_IMAGE_REFS: ${{ inputs.image_refs }}
      INPUTS_CONFIG: ${{ inputs.config }}
