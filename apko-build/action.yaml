name: 'Build image with apko'
description: |
  This action build an OCI image with apko, given a config file
  and tag to use and output a tar file and does not push to a registry.

inputs:
  apko-image:
    description: |
      The digest of the apko image to invoke.
    default: ghcr.io/wolfi-dev/sdk:latest
    required: true

  config:
    description: |
      The config file to use for building the image.
    default: .apko.yaml
    required: false

  lockfile:
    description: |
      The lock file that constraints versions of packages.
    default: ''
    required: false

  keyring-append:
    description: |
      The value to pass to --keyring-append.
    default: ''

  build-repository-append:
    description: |
      The value to pass to --build-repository-append.
    required: false
    default: ''

  repository-append:
    description: |
      The value to pass to --repository-append.
    default: ''

  package-append:
    description: |
      The value to pass to --package-append.
    default: ''

  archs:
    description: |
      The architectures to build for.
    default: ''

  build-options:
    description: |
      Build options to enable (comma-separated).
    default: ''

  source-date-epoch:
    description: |
      The UNIX timestamp to use as the source date when building an image.
      This is set as the SOURCE_DATE_EPOCH environment variable.
    default: ''

  tag:
    description: |
      The tag to use for building the image.
    required: true

  vcs-url:
    description: |
      Whether to detect and embed the VCS URL (unlike apko we default this to false for reproducible builds).
    type: boolean
    required: false
    default: false

  debug:
    description: |
      Enable debug logging.
    type: boolean
    required: false
    default: false

  automount-src:
    description: |
      If this directory is found, create a copy at automount-dest (inside container)
    default: ${{ github.workspace }}/.apko-automount

  automount-dest:
    description: |
      If automount-src is found, create a copy at this location (inside container)
    default: /work

runs:
  using: composite
  steps:
  - shell: bash
    run: |
      APKO_IMAGE="${INPUTS_APKO_IMAGE}"
      if [[ "${APKO_IMAGE}" == "" ]]; then
        echo "Warning: using latest wolfi-dev/sdk image since apko-image input was empty string."
        APKO_IMAGE="ghcr.io/wolfi-dev/sdk:latest"
      fi
      docker run -i --rm --entrypoint /bin/sh \
        -v $PWD:${{ github.workspace }} \
        --workdir ${{ github.workspace }} \
        -e INPUTS_AUTOMOUNT_SRC \
        -e INPUTS_AUTOMOUNT_DEST \
        -e INPUTS_SOURCE_DATE_EPOCH \
        -e INPUTS_KEYRING_APPEND \
        -e INPUTS_BUILD_REPOSITORY_APPEND \
        -e INPUTS_REPOSITORY_APPEND \
        -e INPUTS_PACKAGE_APPEND \
        -e INPUTS_ARCHS \
        -e INPUTS_BUILD_OPTIONS \
        -e INPUTS_VCS_URL \
        -e INPUTS_LOCKFILE \
        -e INPUTS_CONFIG \
        -e INPUTS_TAG \
        "${APKO_IMAGE}" \
        -c "$(cat <<"EOF"
      set -o errexit
      if [ -d "${INPUTS_AUTOMOUNT_SRC}" ]; then
        echo "Creating copy of ${INPUTS_AUTOMOUNT_SRC} at ${INPUTS_AUTOMOUNT_DEST}"
        cp -r "${INPUTS_AUTOMOUNT_SRC}" "${INPUTS_AUTOMOUNT_DEST}"
      fi
      [ -n "${INPUTS_SOURCE_DATE_EPOCH}" ] && export SOURCE_DATE_EPOCH="${INPUTS_SOURCE_DATE_EPOCH}"
      [ -n "${INPUTS_KEYRING_APPEND}" ] && keys="-k ${INPUTS_KEYRING_APPEND}"
      [ -n "${INPUTS_BUILD_REPOSITORY_APPEND}" ] && build_repos="-b ${INPUTS_BUILD_REPOSITORY_APPEND}"
      [ -n "${INPUTS_REPOSITORY_APPEND}" ] && repos="-r ${INPUTS_REPOSITORY_APPEND}"
      [ -n "${INPUTS_PACKAGE_APPEND}" ] && packages="-p ${INPUTS_PACKAGE_APPEND}"
      [ -n "${INPUTS_ARCHS}" ] && archs="--arch ${INPUTS_ARCHS}"
      build_options=""
      if [ -n "${INPUTS_BUILD_OPTIONS}" ]; then
        opts="${INPUTS_BUILD_OPTIONS}"
        for opt in ${opts//,/ }; do
          build_options="${build_options} --build-option ${opt}"
        done
      fi
      /usr/bin/apko build \
        --vcs=${INPUTS_VCS_URL} \
        --lockfile=${INPUTS_LOCKFILE} \
        ${{ inputs.debug && '--log-level debug' }} \
        ${INPUTS_CONFIG} ${INPUTS_TAG} output.tar $keys $build_repos $repos $packages $archs $build_options
      echo EXIT CODE: $?
      EOF
      )"
    env:
      INPUTS_APKO_IMAGE: ${{ inputs.apko-image }}
      INPUTS_AUTOMOUNT_SRC: ${{ inputs.automount-src }}
      INPUTS_AUTOMOUNT_DEST: ${{ inputs.automount-dest }}
      INPUTS_SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
      INPUTS_KEYRING_APPEND: ${{ inputs.keyring-append }}
      INPUTS_BUILD_REPOSITORY_APPEND: ${{ inputs.build-repository-append }}
      INPUTS_REPOSITORY_APPEND: ${{ inputs.repository-append }}
      INPUTS_PACKAGE_APPEND: ${{ inputs.package-append }}
      INPUTS_ARCHS: ${{ inputs.archs }}
      INPUTS_BUILD_OPTIONS: ${{ inputs.build-options }}
      INPUTS_VCS_URL: ${{ inputs.vcs-url }}
      INPUTS_LOCKFILE: ${{ inputs.lockfile }}
      INPUTS_CONFIG: ${{ inputs.config }}
      INPUTS_TAG: ${{ inputs.tag }}
