name: 'Build image snapshot with apko'
description: |
  This action builds an OCI image with apko, given a config file
  and base tag to use.

inputs:
  apko-image:
    description: |
      The digest of the apko image to invoke.
    default: ghcr.io/wolfi-dev/sdk:latest
    required: true

  config:
    description: |
      The config file to use for building the image.
    required: true
    default: .apko.yaml

  lockfile:
    description: |
      The lock file that constraints versions of packages.
    required: false
    default: ''

  base-tag:
    description: |
      The container repository into which we should publish images.
    default: ghcr.io/${{ github.repository }}
    required: true

  target-tag:
    description: |
      The tag this build will produce upon success.  It will also be used
      to form a date-based variant for tracking over time.
    default: latest
    required: true

  registry:
    description: |
      Which registry to use.
    default: ghcr.io
    required: true

  username:
    description: |
      The username to use for docker login step.
    required: true
    default: ${{ github.repository_owner }}

  token:
    description: |
      The token to use for docker login step.
    required: true
    default: ${{ github.token }}

  keyring-append:
    description: |
      The value to pass to --keyring-append.
    required: false
    default: ''

  build-repository-append:
    description: |
      The value to pass to --build-repository-append.
    required: false
    default: ''

  repository-append:
    description: |
      The value to pass to --repository-append.
    required: false
    default: ''

  package-append:
    description: |
      The value to pass to --package-append.
    default: ''

  archs:
    description: |
      The architectures to build for.
    required: false
    default: ''

  build-options:
    description: |
      Build options to enable (comma-separated).
    default: ''

  additional-tags:
    description: |
      Additional tags for the final image.
    required: false
    default: ''

  sbom-attest:
    description: |
      Upload SBOMs as attestations.
    required: false
    default: ''

  # Note: requires "actions: read"
  slsa-attest:
    description: |
      Upload build provenance information as attestation.
    required: false
    default: ''

  generic-user:
    description: |
      Username to login to registry.
    required: false
    default: ''

  generic-pass:
    description: |
      Password to login to registry.
    required: false
    default: ''

  debug:
    description: |
      Enable debug logging.
    required: false
    default: 'false'

  image_refs:
    description: |
      The value to pass to --image-refs.
    default: apko.images

  automount-src:
    description: |
      In subsequent steps, if this directory is found, create a copy at automount-dest (inside container)
    default: ${{ github.workspace }}/.apko-automount

  automount-dest:
    description: |
      In subsequent steps, if automount-src is found, create a copy at this location (inside container)
    default: /work

  source-date-epoch:
    description: |
      The UNIX timestamp to use as the source date when building an image.
    default: ''

  annotations:
    description: |
      Annotations to add to the final image. Format: key1:value1,key2:value2.
    required: false
    default: ''

  FULCIO_URL:
    required: false
    description: address of sigstore PKI server (default "https://fulcio.sigstore.dev")
    default: "https://fulcio.sigstore.dev"

  REKOR_URL:
    required: false
    description: address of rekor STL server (default "https://rekor.sigstore.dev")
    default: "https://rekor.sigstore.dev"

outputs:
  digest:
    value: ${{ steps.apko.outputs.digest }}
    description: |
      The digest of the published container image.
  digest-index:
    value: ${{ steps.extract.outputs.digest-index }}
  digest-amd64:
    value: ${{ steps.extract.outputs.digest-amd64 }}
  digest-arm64:
    value: ${{ steps.extract.outputs.digest-arm64 }}
  digest-386:
    value: ${{ steps.extract.outputs.digest-386 }}
  digest-armv6:
    value: ${{ steps.extract.outputs.digest-armv6 }}
  digest-armv7:
    value: ${{ steps.extract.outputs.digest-armv7 }}
  digest-ppc64le:
    value: ${{ steps.extract.outputs.digest-ppc64le }}
  digest-riscv64:
    value: ${{ steps.extract.outputs.digest-riscv64 }}
  digest-s390x:
    value: ${{ steps.extract.outputs.digest-s390x }}
  shortdigest-index:
    value: ${{ steps.extract.outputs.shortdigest-index }}
  shortdigest-amd64:
    value: ${{ steps.extract.outputs.shortdigest-amd64 }}
  shortdigest-arm64:
    value: ${{ steps.extract.outputs.shortdigest-arm64 }}
  shortdigest-386:
    value: ${{ steps.extract.outputs.shortdigest-386 }}
  shortdigest-armv6:
    value: ${{ steps.extract.outputs.shortdigest-armv6 }}
  shortdigest-armv7:
    value: ${{ steps.extract.outputs.shortdigest-armv7 }}
  shortdigest-ppc64le:
    value: ${{ steps.extract.outputs.shortdigest-ppc64le }}
  shortdigest-riscv64:
    value: ${{ steps.extract.outputs.shortdigest-riscv64 }}
  shortdigest-s390x:
    value: ${{ steps.extract.outputs.shortdigest-s390x }}

runs:
  using: composite
  steps:
    # base-tag, target-tag and additional-tags end up in $GITHUB_OUTPUT and on
    # the crane and cosign command lines. Reject anything that isn't a plain
    # image repository or tag before using them.
    - name: Validate tag inputs
      shell: bash
      env:
        INPUTS_BASE_TAG: ${{ inputs.base-tag }}
        INPUTS_TARGET_TAG: ${{ inputs.target-tag }}
        INPUTS_ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
      run: |
        set -o noglob
        # Registry host, optional port, and repository path. Uppercase is
        # allowed because the default (ghcr.io/<owner>/<repo>) can contain it.
        repo_re='^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
        # OCI distribution spec tag grammar.
        tag_re='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
        if [[ ! "${INPUTS_BASE_TAG}" =~ ${repo_re} ]]; then
          echo "::error::invalid base-tag: must be an image repository such as ghcr.io/owner/name"
          exit 1
        fi
        if [[ ! "${INPUTS_TARGET_TAG}" =~ ${tag_re} ]]; then
          echo "::error::invalid target-tag: must match ${tag_re}"
          exit 1
        fi
        for tag in ${INPUTS_ADDITIONAL_TAGS//,/ }; do
          if [[ ! "${tag}" =~ ${tag_re} ]]; then
            echo "::error::invalid entry in additional-tags: each tag must match ${tag_re}"
            exit 1
          fi
        done

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Setup QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Generate snapshot date
      id: snapshot-date
      run: |
        echo date=$(date -u +%Y%m%d) >> $GITHUB_OUTPUT
      shell: bash

    - name: Generate dynamic inputs for apko-publish
      shell: bash
      id: apko-publish-inputs
      run: |
        # If sbom-attest enabled, write SBOMs to working directory to attest later
        echo "sbom-path=${{ inputs.sbom-attest == 'true' && '.' || ''}}" >> $GITHUB_OUTPUT

    # Only publish the versioned tag to start.  After we have signed and
    # attested things, then we use crane to update :latest below.
    # Use the apko-publish from this same repo at the ref the caller pinned
    # apko-snapshot to, so it never lags behind a pinned SHA. Requires the
    # GitHub Actions runner 2.336.0 or newer; not available on GHES.
    - uses: $/apko-publish
      id: apko
      with:
        apko-image: ${{ inputs.apko-image }}
        config: ${{ inputs.config }}
        lockfile: ${{ inputs.lockfile }}
        tag: ${{ inputs.base-tag }}:${{ inputs.target-tag }}-${{ steps.snapshot-date.outputs.date }}
        image_refs: ${{ inputs.image_refs }}
        keyring-append: ${{ inputs.keyring-append }}
        build-repository-append: ${{ inputs.build-repository-append }}
        repository-append: ${{ inputs.repository-append }}
        package-append: ${{ inputs.package-append }}
        archs: ${{ inputs.archs }}
        debug: ${{ inputs.debug }}
        automount-src: ${{ inputs.automount-src }}
        automount-dest: ${{ inputs.automount-dest }}
        build-options: ${{ inputs.build-options }}
        sbom-path: ${{ steps.apko-publish-inputs.outputs.sbom-path }}
        generic-user: ${{ inputs.generic-user }}
        generic-pass: ${{ inputs.generic-pass }}
        annotations: ${{ inputs.annotations }}
        source-date-epoch: ${{ inputs.source-date-epoch }}

    - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        INPUTS_IMAGE_REFS: ${{ inputs.image_refs }}
        INPUTS_FULCIO_URL: ${{ inputs.FULCIO_URL }}
        INPUTS_REKOR_URL: ${{ inputs.REKOR_URL }}
      run: |
        # image_refs is a file with one image reference per line.
        mapfile -t refs < "${INPUTS_IMAGE_REFS}"
        cosign sign --yes \
            --fulcio-url "${INPUTS_FULCIO_URL}" --rekor-url "${INPUTS_REKOR_URL}" \
            -a sha=${{ github.sha }} \
            -a run_id=${{ github.run_id }} \
            -a run_attempt=${{ github.run_attempt }} \
            -- "${refs[@]}"

    - name: Extract the digests for each architecture
      id: extract
      shell: bash
      run: |
        # Everything written to $GITHUB_OUTPUT below must be a single line;
        # check the values that come from apko and the registry first.
        digest_re='^sha256:[0-9a-f]{64}$'
        if [[ ! "${STEPS_APKO_OUTPUTS_DIGEST}" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::unexpected digest from apko-publish: ${STEPS_APKO_OUTPUTS_DIGEST@Q}"
          exit 1
        fi
        output="digest-index=${STEPS_APKO_OUTPUTS_DIGEST}"
        echo "Adding GitHub step output: ${output}"
        echo "${output}" >> $GITHUB_OUTPUT
        output="shortdigest-index=$(echo "${STEPS_APKO_OUTPUTS_DIGEST}" | cut -d@ -f 2)"
        echo "Adding GitHub step output: ${output}"
        echo "${output}" >> $GITHUB_OUTPUT

        # If its an index, extract the platform digests too
        CRANE_MANIFEST_OUTPUT="$(crane manifest -- "${STEPS_APKO_OUTPUTS_DIGEST}")"
        if [[ "$(echo $CRANE_MANIFEST_OUTPUT | jq -r .mediaType)" == "application/vnd.oci.image.index.v1+json" ]]; then
          for combo in `echo $CRANE_MANIFEST_OUTPUT | jq -r '.manifests[] | .platform.architecture + .platform.variant + "_" + .digest'`; do
            arch="$(echo "${combo}" | cut -d "_" -f1)"
            digest="$(echo "${combo}" | cut -d "_" -f2)"
            if [[ ! "${arch}" =~ ^[A-Za-z0-9]+$ || ! "${digest}" =~ ${digest_re} ]]; then
              echo "::error::unexpected platform entry in the image index: ${combo@Q}"
              exit 1
            fi
            output="digest-${arch}=${INPUTS_BASE_TAG}@${digest}"
            echo "Adding GitHub step output: ${output}"
            echo "${output}" >> $GITHUB_OUTPUT
            output="shortdigest-${arch}=${digest}"
            echo "Adding GitHub step output: ${output}"
            echo "${output}" >> $GITHUB_OUTPUT
          done
        fi
      env:
        STEPS_APKO_OUTPUTS_DIGEST: ${{ steps.apko.outputs.digest }}
        INPUTS_BASE_TAG: ${{ inputs.base-tag }}

    - name: Upload SBOMs as attestations
      if: ${{ inputs.sbom-attest == 'true' }}
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        STEPS_EXTRACT_OUTPUTS_DIGEST_INDEX: ${{ steps.extract.outputs.digest-index }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_AMD64: ${{ steps.extract.outputs.digest-amd64 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_ARM64: ${{ steps.extract.outputs.digest-arm64 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_386: ${{ steps.extract.outputs.digest-386 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV6: ${{ steps.extract.outputs.digest-armv6 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV7: ${{ steps.extract.outputs.digest-armv7 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_PPC64LE: ${{ steps.extract.outputs.digest-ppc64le }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_RISCV64: ${{ steps.extract.outputs.digest-riscv64 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_S390X: ${{ steps.extract.outputs.digest-s390x }}
      run: |
        function attest_sbom {
          arch="${1}"
          digest="${2}"
          sbomfile="${3}"
          if [[ "${sbomfile}" == "" ]]; then
            echo "Unknown architecture: ${arch}. Exiting."
            exit 1
          fi
          if [[ ! -f "${sbomfile}" ]]; then
            echo "Unable to find SBOM on disk: ${sbomfile} (arch: ${arch}). Exiting."
            exit 1
          fi
          echo "Attaching ${sbomfile} to ${digest} as spdxjson attestation (arch: ${arch}) ..."
          cosign attest --yes --type spdxjson --predicate "${sbomfile}" -- "${digest}"
          rm -f "${sbomfile}"
        }

        # First attest the index SBOM
        attest_sbom "index" "${STEPS_EXTRACT_OUTPUTS_DIGEST_INDEX}" "sbom-index.spdx.json"

        # Next, for each architecture (if present)
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_AMD64}" == "" ]] || attest_sbom "amd64" "${STEPS_EXTRACT_OUTPUTS_DIGEST_AMD64}" "sbom-x86_64.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARM64}" == "" ]] || attest_sbom "arm64" "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARM64}" "sbom-aarch64.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_386}" == "" ]] || attest_sbom "386" "${STEPS_EXTRACT_OUTPUTS_DIGEST_386}" "sbom-x86.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV6}" == "" ]] || attest_sbom "armv6" "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV6}" "sbom-armhf.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV7}" == "" ]] || attest_sbom "armv7" "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV7}" "sbom-armv7.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_PPC64LE}" == "" ]] || attest_sbom "ppc64le" "${STEPS_EXTRACT_OUTPUTS_DIGEST_PPC64LE}" "sbom-ppc64le.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_RISCV64}" == "" ]] || attest_sbom "riscv64" "${STEPS_EXTRACT_OUTPUTS_DIGEST_RISCV64}" "sbom-riscv64.spdx.json"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_S390X}" == "" ]] || attest_sbom "s390x" "${STEPS_EXTRACT_OUTPUTS_DIGEST_S390X}" "sbom-s390x.spdx.json"

    # See https://github.com/slsa-framework/slsa-github-generator/tree/main/internal/builders/container
    - name: 'SLSA: Generate provenance and attest'
      if: ${{ inputs.slsa-attest == 'true' }}
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        GENERATOR_REPOSITORY: slsa-framework/slsa-github-generator
        GENERATOR_RELEASE_TAG: v1.5.0
        GENERATOR_RELEASE_BINARY: slsa-generator-container-linux-amd64
        GENERATOR_RELEASE_BINARY_SHA256: 6d8b83327ac2134aa8760e1e4f9cd5d3fdbcb56599e39be2cd965f1e04aa8ede
        GH_TOKEN: "${{ github.token }}"
        GITHUB_CONTEXT: "${{ toJSON(github) }}" # Needed by slsa-generator-container
        STEPS_EXTRACT_OUTPUTS_DIGEST_INDEX: ${{ steps.extract.outputs.digest-index }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_AMD64: ${{ steps.extract.outputs.digest-amd64 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_ARM64: ${{ steps.extract.outputs.digest-arm64 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_386: ${{ steps.extract.outputs.digest-386 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV6: ${{ steps.extract.outputs.digest-armv6 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV7: ${{ steps.extract.outputs.digest-armv7 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_PPC64LE: ${{ steps.extract.outputs.digest-ppc64le }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_RISCV64: ${{ steps.extract.outputs.digest-riscv64 }}
        STEPS_EXTRACT_OUTPUTS_DIGEST_S390X: ${{ steps.extract.outputs.digest-s390x }}
      run: |
        set -x
        # Fetch the generator
        gh release -R "${GENERATOR_REPOSITORY}" download "${GENERATOR_RELEASE_TAG}" -p "${GENERATOR_RELEASE_BINARY}"
        COMPUTED_HASH="$(sha256sum "${GENERATOR_RELEASE_BINARY}" | awk '{print $1}')"
        if [[ "${COMPUTED_HASH}" != "${GENERATOR_RELEASE_BINARY_SHA256}" ]]; then
          echo "Mismatched checksums (wanted ${GENERATOR_RELEASE_BINARY_SHA256} got ${COMPUTED_HASH}). Exiting."
          exit 1
        fi
        chmod +x "${GENERATOR_RELEASE_BINARY}"

        # Create the provenance document
        trap "rm -f provenance.json" EXIT
        echo "Generating SLSA build provenance ..."
        "./${GENERATOR_RELEASE_BINARY}" generate --predicate="provenance.json"
        echo "Provenance doc:"
        cat provenance.json | jq

        function attest_slsa {
          arch="${1}"
          digest="${2}"
          echo "Attaching SLSA build provenance to ${digest} (arch: ${arch}) ..."
          cosign attest --yes --type slsaprovenance --predicate="provenance.json" -- "${digest}"
        }

        # First attest the index
        attest_slsa "index" "${STEPS_EXTRACT_OUTPUTS_DIGEST_INDEX}"

        # Next, for each architecture (if present)
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_AMD64}" == "" ]] || attest_slsa "amd64" "${STEPS_EXTRACT_OUTPUTS_DIGEST_AMD64}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARM64}" == "" ]] || attest_slsa "arm64" "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARM64}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_386}" == "" ]] || attest_slsa "386" "${STEPS_EXTRACT_OUTPUTS_DIGEST_386}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV6}" == "" ]] || attest_slsa "armv6" "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV6}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV7}" == "" ]] || attest_slsa "armv7" "${STEPS_EXTRACT_OUTPUTS_DIGEST_ARMV7}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_PPC64LE}" == "" ]] || attest_slsa "ppc64le" "${STEPS_EXTRACT_OUTPUTS_DIGEST_PPC64LE}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_RISCV64}" == "" ]] || attest_slsa "riscv64" "${STEPS_EXTRACT_OUTPUTS_DIGEST_RISCV64}"
        [[ "${STEPS_EXTRACT_OUTPUTS_DIGEST_S390X}" == "" ]] || attest_slsa "s390x" "${STEPS_EXTRACT_OUTPUTS_DIGEST_S390X}"

    # Now that everything else has completed successfully, update the target tag.
    # based on the digest produced above.
    - shell: bash
      run: |
        set -x
        # additional-tags is split on commas and spaces below; don't let a "*"
        # in it match files.
        set -o noglob

        crane cp -- "${STEPS_APKO_OUTPUTS_DIGEST}" "${INPUTS_BASE_TAG}:${INPUTS_TARGET_TAG}"

        for tag in ${INPUTS_ADDITIONAL_TAGS//,/ }
        do
          crane cp -- "${STEPS_APKO_OUTPUTS_DIGEST}" "${INPUTS_BASE_TAG}:${tag}"
        done
      env:
        STEPS_APKO_OUTPUTS_DIGEST: ${{ steps.apko.outputs.digest }}
        INPUTS_BASE_TAG: ${{ inputs.base-tag }}
        INPUTS_TARGET_TAG: ${{ inputs.target-tag }}
        INPUTS_ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
