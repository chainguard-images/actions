name: test-action-args

on:
  pull_request:
    paths:
      - apko-build/action.yaml
      - apko-publish/action.yaml
      - apko-snapshot/action.yaml
      - vul-scans/action.yaml
      - tests/**
      - .github/workflows/test-action-args.yaml
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  argv-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r tests/requirements.txt
          # busybox is preinstalled on ubuntu-latest; fail loudly if that changes.
          command -v busybox

      - name: Run argument tests
        run: python -m unittest discover -s tests -p 'test_*.py' --verbose
