name: 'Add additonal tags to image'
description: |
  This action discovers additional tags for the distroless image
  and adds them to the image.

inputs:
  distroless_image:
    description: |
      The distroless image to add tags to
    required: true
    default: ''

  docker_image:
    description: |
      The docker image to compare the distroless image against.
    default: ''
    required: true

  docker_image_tag:
    description: |
      Tag for the docker image.
    default: ''
    required: true

  registry:
    description: |
      Which registry to use.
    default: ghcr.io
    required: true

  username:
    description: |
      The username to use for docker login step.
    required: true
    default: ${{ github.repository_owner }}

  token:
    description: |
      The token to use for docker login step.
    required: true
    default: ${{ github.token }}

  excluded_tags:
    description: |
      Comma separated list of tag regexes to ignore.
    default: ''
    required: false

runs:
  using: composite
  steps:
    - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.25
        check-latest: true

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}

    - name: Run tagging script
      shell: bash
      env:
        DISTROLESS_IMAGE: ${{ inputs.distroless_image }}
        DOCKER_IMAGE_TAG: ${{ inputs.docker_image_tag }}
        DOCKER_IMAGE: ${{ inputs.docker_image }}
        EXCLUDED_TAGS: ${{ inputs.excluded_tags }}
        # Build from the action's own checked-out copy, at the ref the caller
        # pinned this action to, instead of a separate unpinned checkout of
        # chainguard-images/actions into the caller's workspace.
        ACTION_PATH: ${{ github.action_path }}
      run: |
        tagrun="${RUNNER_TEMP}/tag-run"
        (cd "${ACTION_PATH}" && go build -o "${tagrun}" .)
        "${tagrun}" \
          -distroless-image="${DISTROLESS_IMAGE}" \
          -docker-image-tag="${DOCKER_IMAGE_TAG}" \
          -docker-image="${DOCKER_IMAGE}" \
          -excluded-tags="${EXCLUDED_TAGS}"
