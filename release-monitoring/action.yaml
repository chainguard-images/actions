name: 'Fetch versions from release-monitoring.org'
description: |
  This action returns a list of versions for a specifc project
  that is available on release-monitoring.org.

inputs:
  project-id:
    description: |
      The unique ID of project on release-monitoring.org
    required: true
  api-token:
    description: |
      API token for release-monitoring.org
    required: false

outputs:
  latest-version:
    description: |
      The latest version of the project
    value: ${{ steps.release-monitoring.outputs.latest-version }}
  stable-versions:
    description: |
      A comma-separated list of all stable versions of the project
    value: ${{ steps.release-monitoring.outputs.stable-versions }}
  all-versions:
    description: |
      A comma-separated list of all versions of the project
    value: ${{ steps.release-monitoring.outputs.all-versions }}

runs:
  using: 'composite'

  steps:
    - name: List project versions from release-monitoring.org
      id: release-monitoring
      shell: bash
      run: |
        set -x
        if [[ "${INPUTS_API_TOKEN}" == "" ]]; then
          echo "Warning: running without a registered API token"
        fi
        # project-id is interpolated into the request URL; it is a numeric id.
        if [[ ! "${INPUTS_PROJECT_ID}" =~ ^[0-9]+$ ]]; then
          echo "::error::invalid project-id: must be a number"
          exit 1
        fi
        TMP="$(mktemp /tmp/release-monitoring-action.XXXXXX)"
        trap "rm -rf ${TMP}" EXIT
        curl --fail -L -v -H "Authorization: Bearer ${INPUTS_API_TOKEN}" \
          "https://release-monitoring.org/api/v2/versions/?project_id=${INPUTS_PROJECT_ID}" \
          > "${TMP}"
        echo "Response:"
        echo "--------"
        cat "${TMP}"
        emit() {
          # Write one single-line step output. Refuse a value containing a
          # newline or carriage return so a crafted API response can't add
          # extra lines to $GITHUB_OUTPUT.
          local name="$1" value="$2"
          case "${value}" in
            *[$'\n\r']*)
              echo "::error::refusing to write a multiline value to ${name}"
              exit 1 ;;
          esac
          printf '%s=%s\n' "${name}" "${value}" >> "$GITHUB_OUTPUT"
        }
        emit latest-version "$(jq -r .latest_version < "${TMP}")"
        emit stable-versions "$(jq -r '.stable_versions | join(",")' < "${TMP}")"
        emit all-versions "$(jq -r '.versions | join(",")' < "${TMP}")"
      env:
        INPUTS_API_TOKEN: ${{ inputs.api-token }}
        INPUTS_PROJECT_ID: ${{ inputs.project-id }}
