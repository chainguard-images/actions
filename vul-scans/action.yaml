name: 'Scan image snapshot'
description: |
  This action scans an OCI image

inputs:

  image:
    description: |
      The container image into which we should publish attestation.
    required: true

  registry:
    description: |
      Which registry to use.
    default: ghcr.io
    required: false

  username:
    description: |
      The username to use for docker login step.
    default: ${{ github.repository_owner }}
    required: false

  password:
    description: |
      The token to use for docker login step.
    required: false
    default: ${{ github.token }}

  DOCKER_LOGIN:
    description: Login for private regsitries
    required: false
    default: true

  debug:
    description: |
      Enable debug logging.
    required: false
    default: "false"

  UPLOAD_GITHUB_CODE:
    description: |
      Upload Scan results to github security
    required: false
    default: "false"

  RUN_TRIVY:
    description: Run trivy scan or not.
    required: true
    default: "true"

  RUN_GRYPE:
    description: Run grype scan or not.
    required: true
    default: "true"

  RUN_SNYK:
    description: Run snyk scan or not, set SNYK_TOKEN as well
    required: true
    default: "true"

  SNYK_TOKEN:
    description: |
      SNYK Token for vul scanning
    required: true

  SNYK_VERSION:
    description: |
      SNYK Token for vul scanning
    required: false
    default: "v1.966.0"

  FULCIO_URL:
    required: false
    description: address of sigstore PKI server (default "https://fulcio.sigstore.dev")
    default: "https://fulcio.sigstore.dev"

  REKOR_URL:
    required: false
    description:   address of rekor STL server (default "https://rekor.sigstore.dev")
    default: "https://rekor.sigstore.dev"

outputs:
  TRIVY_COUNT:
    description: Number of vulnerables in trivy scan
    value: ${{ steps.scan-report.outputs.TRIVY_COUNT }}
  GRYPE_COUNT:
    description: Number of vulnerables in Grype scan
    value: ${{ steps.scan-report.outputs.GRYPE_COUNT }}
  SNYK_COUNT:
    description: Number of Vulnerables in Snyk scan
    value: ${{ steps.scan-report.outputs.SNYK_COUNT }}

runs:
  using: composite
  steps:
    - name: Setup cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      if: inputs.DOCKER_LOGIN == 'true'
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    # The image is passed to snyk, cosign and trivy-action as a command-line
    # argument. Reject values that a tool could split into several arguments
    # or read as a flag.
    - name: Validate image input
      shell: bash
      env:
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        if [[ -z "${INPUTS_IMAGE}" || "${INPUTS_IMAGE}" == -* || "${INPUTS_IMAGE}" =~ [[:space:][:cntrl:]] ]]; then
          echo "::error::invalid image input: it must be non-empty, must not start with '-', and must not contain whitespace"
          exit 1
        fi

    - id: scan-start
      run: |
        echo "date=$(TZ=Zulu date "+%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
      shell: bash

    - id: install-snyk
      if: inputs.RUN_SNYK == 'true'
      name: Run Snyk to check Docker image for vulnerabilities
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.SNYK_TOKEN }}
        SNYK_VERSION: ${{ inputs.SNYK_VERSION }}
      run: |
        set -ex

        # SNYK_VERSION is written to $GITHUB_ENV below; reject anything that
        # could smuggle in extra lines.
        if [[ ! "${SNYK_VERSION}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "invalid SNYK_VERSION: ${SNYK_VERSION}"
          exit 1
        fi

        SNYK_DOWNLOAD="snyk-linux"

        if [ "$RUNNER_OS" == "Linux" ]; then
          SNYK_DOWNLOAD="snyk-linux"
        elif [ "$RUNNER_OS" == "Windows" ]; then
          SNYK_DOWNLOAD="snyk-win.exe"
        elif [ "$RUNNER_OS" == "macOS" ]; then
          SNYK_DOWNLOAD="snyk-macos"
        else
          echo "$RUNNER_OS not supported"
          exit 1
        fi

        curl -s -o snyk https://static.snyk.io/cli/${SNYK_VERSION}/${SNYK_DOWNLOAD}

        # Verify downloaded binary against known-good sha256 checksum.
        # Checksums sourced from https://static.snyk.io/cli/v1.966.0/sha256sums.txt.asc
        curl -sL "https://static.snyk.io/cli/${SNYK_VERSION}/${SNYK_DOWNLOAD}.sha256" -o snyk.sha256
        echo "$(cat snyk.sha256)" | sha256sum -c -

        echo "SNYK_VERSION=${SNYK_VERSION}" >> $GITHUB_ENV
        echo "SNYK_URL=https://static.snyk.io/cli/${SNYK_VERSION}/${SNYK_DOWNLOAD}" >> $GITHUB_ENV

        chmod +x snyk

    - name: Run Snyk to check Docker image for vulnerabilities
      if: inputs.RUN_SNYK == 'true'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.SNYK_TOKEN }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        ./snyk container test "${INPUTS_IMAGE}" \
        --app-vulns --json --severity-threshold=low \
        --json-file-output=snyk.json >/dev/null || true

    - name: Cosign Attest Snyk results
      if: inputs.RUN_SNYK == 'true'
      shell: bash
      id: snyk-attest
      env:
        COSIGN_EXPERIMENTAL: "true"
        STEPS_SCAN_START_OUTPUTS_DATE: ${{ steps.scan-start.outputs.date }}
        INPUTS_FULCIO_URL: ${{ inputs.FULCIO_URL }}
        INPUTS_REKOR_URL: ${{ inputs.REKOR_URL }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        ATTESTATION=$(mktemp)

        echo "Snyk SCANNER_URI: ${SNYK_URL}"
        echo "Snyk SCANNER_VERSION: ${SNYK_VERSION}"

        cat > "${ATTESTATION}" <<EOF
        {
            "invocation": {
              "parameters": null,
              "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "event_id": "${{ github.run_id }}",
              "builder.id": "${GITHUB_WORKFLOW}"
            },
            "scanner": {
              "uri": "${SNYK_URL}",
              "version": "${SNYK_VERSION}",
              "result": $(cat snyk.json | jq .)
            },
            "metadata": {
              "scanStartedOn": "${STEPS_SCAN_START_OUTPUTS_DATE}",
              "scanFinishedOn": "$(TZ=Zulu date "+%Y-%m-%dT%H:%M:%SZ")"
            }
        }
        EOF

        export COSIGN_EXPERIMENTAL="$COSIGN_EXPERIMENTAL"

        cosign attest --fulcio-url "${INPUTS_FULCIO_URL}"  --rekor-url "${INPUTS_REKOR_URL}" \
        --type vuln --predicate "${ATTESTATION}" -- "${INPUTS_IMAGE}"

    # Note: using a fork. See open PR:
    # https://github.com/aquasecurity/trivy-action/pull/191
    - name:  Scan image with AquaSec/Trivy
      if: inputs.RUN_TRIVY == 'true'
      uses: jdolitsky/trivy-action@ad6600ee3f2edf9409efb1321d83ed68a0716b20
      id: trivy-scan
      with:
        image-ref: ${{ inputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: 0
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
        offline-scan: 'true'

    - name: Cosign Attest trivy results
      if: inputs.RUN_TRIVY == 'true'
      shell: bash
      id: trivy-attest
      env:
        COSIGN_EXPERIMENTAL: "true"
        STEPS_SCAN_START_OUTPUTS_DATE: ${{ steps.scan-start.outputs.date }}
        INPUTS_FULCIO_URL: ${{ inputs.FULCIO_URL }}
        INPUTS_REKOR_URL: ${{ inputs.REKOR_URL }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        ATTESTATION=$(mktemp)

        export SCANNER_URI=$(cat trivy-results.sarif | jq -r .runs[0].tool.driver.informationUri)
        export SCANNER_VERSION=$(cat trivy-results.sarif | jq -r .runs[0].tool.driver.version)

        echo "trivy SCANNER_URI: $SCANNER_URI"
        echo "trivy SCANNER_VERSION: $SCANNER_VERSION"

        cat > "${ATTESTATION}" <<EOF
        {
            "invocation": {
              "parameters": null,
              "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "event_id": "${{ github.run_id }}",
              "builder.id": "${GITHUB_WORKFLOW}"
            },
            "scanner": {
              "uri": "$SCANNER_URI",
              "version": "$SCANNER_VERSION",
              "result": $(cat trivy-results.sarif | jq .)
            },
            "metadata": {
              "scanStartedOn": "${STEPS_SCAN_START_OUTPUTS_DATE}",
              "scanFinishedOn": "$(TZ=Zulu date "+%Y-%m-%dT%H:%M:%SZ")"
            }
        }
        EOF

        export COSIGN_EXPERIMENTAL="$COSIGN_EXPERIMENTAL"

        cosign attest --fulcio-url "${INPUTS_FULCIO_URL}"  --rekor-url "${INPUTS_REKOR_URL}" \
        --type vuln --predicate "${ATTESTATION}" -- "${INPUTS_IMAGE}"


    - name: Scan image with Anchore/Grype
      if: inputs.RUN_GRYPE == 'true'
      id: grype-scan
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      with:
        image: ${{ inputs.image }}
        fail-build: false
        severity-cutoff: low

    - name: Cosign Attest Grype results
      if: inputs.RUN_GRYPE == 'true'
      shell: bash
      id: grype-attest
      env:
        COSIGN_EXPERIMENTAL: "true"
        STEPS_GRYPE_SCAN_OUTPUTS_SARIF: ${{ steps.grype-scan.outputs.sarif }}
        STEPS_SCAN_START_OUTPUTS_DATE: ${{ steps.scan-start.outputs.date }}
        INPUTS_FULCIO_URL: ${{ inputs.FULCIO_URL }}
        INPUTS_REKOR_URL: ${{ inputs.REKOR_URL }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        ATTESTATION=$(mktemp)

        export SCANNER_URI=$(cat "${STEPS_GRYPE_SCAN_OUTPUTS_SARIF}" | jq -r .runs[0].tool.driver.informationUri)
        export SCANNER_VERSION=$(cat "${STEPS_GRYPE_SCAN_OUTPUTS_SARIF}" | jq -r .runs[0].tool.driver.version)

        echo "grype SCANNER_URI: $SCANNER_URI"
        echo "grype SCANNER_VERSION: $SCANNER_VERSION"

        cat > "${ATTESTATION}" <<EOF
        {
            "invocation": {
              "parameters": null,
              "uri": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "event_id": "${{ github.run_id }}",
              "builder.id": "${GITHUB_WORKFLOW}"
            },
            "scanner": {
              "uri": "$SCANNER_URI",
              "version": "$SCANNER_VERSION",
              "result": $(cat "${STEPS_GRYPE_SCAN_OUTPUTS_SARIF}" | jq .)
            },
            "metadata": {
              "scanStartedOn": "${STEPS_SCAN_START_OUTPUTS_DATE}",
              "scanFinishedOn": "$(TZ=Zulu date "+%Y-%m-%dT%H:%M:%SZ")"
            }
        }
        EOF

        export COSIGN_EXPERIMENTAL="$COSIGN_EXPERIMENTAL"

        cosign attest --fulcio-url "${INPUTS_FULCIO_URL}"  --rekor-url "${INPUTS_REKOR_URL}" \
        --type vuln --predicate "${ATTESTATION}" -- "${INPUTS_IMAGE}" 


    - name: High Level Scan report
      id: scan-report
      shell: bash
      run: |
        GRYPE_COUNT="0"
        if [ "${INPUTS_RUN_GRYPE}" = "true" ]; then
          GRYPE_COUNT=$(cat "${STEPS_GRYPE_SCAN_OUTPUTS_SARIF}" | jq '.runs[0].results | length')
        fi

        TRIVY_COUNT="0"
        if [ "${INPUTS_RUN_TRIVY}" = "true" ]; then
          TRIVY_COUNT=$(cat trivy-results.sarif | jq '.runs[0].results | length')
        fi

        SNYK_COUNT="0"
        if [ "${INPUTS_RUN_SNYK}" = "true" ]; then
          SNYK_COUNT=$(cat snyk.json | jq .uniqueCount)
        fi

        echo "SNYK_COUNT: $SNYK_COUNT, GRYPE_COUNT: $GRYPE_COUNT, TRIVY_COUNT: $TRIVY_COUNT"

        echo "SNYK_COUNT=$SNYK_COUNT" >> $GITHUB_OUTPUT
        echo "GRYPE_COUNT=$GRYPE_COUNT" >> $GITHUB_OUTPUT
        echo "TRIVY_COUNT=$TRIVY_COUNT" >> $GITHUB_OUTPUT
      env:
        INPUTS_RUN_GRYPE: ${{ inputs.RUN_GRYPE }}
        STEPS_GRYPE_SCAN_OUTPUTS_SARIF: ${{ steps.grype-scan.outputs.sarif }}
        INPUTS_RUN_TRIVY: ${{ inputs.RUN_TRIVY }}
        INPUTS_RUN_SNYK: ${{ inputs.RUN_SNYK }}

    - name: Cue Verify Attestation
      id: cue-verify
      shell: bash
      env:
        COSIGN_EXPERIMENTAL: "true"
        INPUTS_REKOR_URL: ${{ inputs.REKOR_URL }}
        INPUTS_IMAGE: ${{ inputs.image }}
      run: |
        cat > vulnz.cue <<EOF
          predicateType: "cosign.sigstore.dev/attestation/vuln/v1"
        EOF
        
        export COSIGN_EXPERIMENTAL="$COSIGN_EXPERIMENTAL"
        
        cosign verify-attestation --rekor-url "${INPUTS_REKOR_URL}" \
          --type vuln --policy vulnz.cue -- "${INPUTS_IMAGE}" || \
          echo "WARNING: Could not verify attestation (is this a private image?)"
